# /etc/sysctl.d/99-logsikka.conf
# The collector asks for an 8 MB UDP receive buffer; Linux silently caps it at rmem_max (about 200 KB by default).
net.core.rmem_max = 16777216
net.core.rmem_default = 8388608
net.core.netdev_max_backlog = 50000
# Many FortiGate TCP syslog sessions
net.core.somaxconn = 4096
